model:
  name: "mistral-small-latest"
  temperature: 0.7
  max_tokens: 1024

session:
  db_path: "data/chat_history.db"

logging:
  level: "INFO"
  format: "%(asctime)s | %(levelname)s | %(name)s | %(message)s"

memory:
  summary_threshold: 20
  window_size: 6

rag:
  chunk_size: 500
  chunk_overlap: 50
  vector_store_path: "data/vector_store"
  embedding_model: "all-MiniLM-L6-v2"
  top_k: 3
