[project]
name = "chatbot"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "langgraph>=0.2.0",
    "langchain-mistralai>=0.1.0",
    "langchain-google-genai>=0.1.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "streamlit>=1.30.0",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    "data",
    ".venv",
    "chatbot.egg-info",
    "src/api",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # line too long — we allow long strings/prompts
    "E402",  # module level import not at top — needed for load_dotenv patterns
    "F401",  # imported but unused — allowed for re-exports
]
